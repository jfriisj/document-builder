  - id: floating_deadlines_step
    title: 3. Faste frister uden fast måned
    description: Frister udløst af særlige hændelser eller triggere.
    fields:
      - id: floating_deadlines
        type: repeater
        label: Flydende frister
        required: false
        fields:
          - id: deadline_trigger
            type: text
            label: Frist / trigger
            required: true
            placeholder: f.eks. 14 dage før generalforsamling / Ved sæsonafslutning
          - id: task
            type: text
            label: Opgave
            required: true
            placeholder: Hvad skal udføres?
          - id: responsible
            type: text
            label: Ansvarlig
            required: false
            placeholder: Ansvarlig person eller rolle
          - id: warning_before
            type: text
            label: Varsling før
            required: false
            placeholder: f.eks. 3 uger før / 1 måned før
          - id: notes
            type: text
            label: Bemærkning
            required: false
            placeholder: Supplerende noter eller afhængigheder

  - id: annual_evaluation
    title: 4. Årlig evaluering
    description: Opsamling og erfaringer til næste års planlægning.
    fields:
      - id: evaluation_worked_well
        type: textarea
        label: Hvad fungerede godt?
        required: false
        placeholder: Succeser og velfungerende arbejdsgange...
      - id: evaluation_next_year_changes
        type: textarea
        label: Hvad skal flyttes / ændres næste år?
        required: false
        placeholder: Justeringer af tidspunkter eller opgaver...
      - id: evaluation_new_activities
        type: textarea
        label: Nye faste aktiviteter
        required: false
        placeholder: Aktiviteter der bør optages i årshjulet fremover...
      - id: evaluation_retired_activities
        type: textarea
        label: Aktiviteter der udgår
        required: false
        placeholder: Opgaver eller frister der ikke længere er relevante...
