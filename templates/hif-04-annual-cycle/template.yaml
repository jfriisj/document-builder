id: hif-04-annual-cycle
version: 1
enabled: true
title: HIF-04 Årshjul
category: Drift og opgaver
description: Samlet oversigt over faste aktiviteter, frister og tilbagevendende opgaver gennem året for Hashøj IF.
steps:
  - id: basic_info
    title: 1. Stamdata & Dokumentstyring
    description: Grundlæggende information om dokumentejer og versionsstyring.
    fields:
      - id: owner_committee
        type: select
        label: Dokumentejer / udvalg
        required: true
        options:
          - value: Bestyrelsen
            label: Bestyrelsen
          - value: Fodboldudvalget
            label: Fodboldudvalget
          - value: Gymnastikudvalget
            label: Gymnastikudvalget
          - value: Badmintonudvalget
            label: Badmintonudvalget
          - value: E-sport
            label: E-sport
          - value: Klubhus & Anlæg
            label: Klubhus & Anlæg
          - value: Arrangementsudvalg
            label: Arrangementsudvalg
          - value: Fælles / Tværgående
            label: Fælles / Tværgående
      - id: version_label
        type: text
        label: Version
        required: false
        default: "1.0"
      - id: updated_at
        type: date
        label: Senest opdateret
        required: false
      - id: approved_by
        type: text
        label: Godkendt af
        required: false
        placeholder: f.eks. Bestyrelsen / Udvalgsformand
      - id: privacy_notice
        type: info
        variant: privacy
        text: >-
          Navne og kontaktoplysninger på ansvarlige personer og godkendere
          behandles af Dokumentbyggeren kun under den aktive session til at generere
          årshjulet og lagres ikke permanent af applikationen.

