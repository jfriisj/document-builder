      - id: check_retention_action
        type: text
        label: Slettefrister er kendt og følges (Handling / deadline)
        required: false
      - id: check_retention_resp
        type: text
        label: Slettefrister er kendt og følges (Ansvarlig)
        required: false
      - id: check_processors_status
        type: select
        label: Databehandlere / systemer er kendte (Status)
        required: false
        default: OK
        options:
          - value: OK
            label: OK
          - value: I gang
            label: I gang
          - value: Mangler
            label: Mangler
          - value: N/A
            label: N/A
      - id: check_processors_action
        type: text
        label: Databehandlere / systemer er kendte (Handling / deadline)
