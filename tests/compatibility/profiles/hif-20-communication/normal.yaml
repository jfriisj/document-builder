call_to_action: Tilmeld dig og din familie til aftenens grillbuffet senest d. 1. juni
  via foreningens hjemmeside.
deadline_practical_info: 'Lørdag 13. juni kl. 10:00 - 22:00 ved Klubhuset. Tilmeldingsfrist
  til spisning: 1. juni 2026.'
draft_body: 'Kære medlemmer og venner af Hashøj IF!


  Vi glæder os utrolig meget til at byde jer alle velkommen til årets helt store samlingspunkt
  – Hashøj Sommerfest 2026.


  Dagen byder på masser af idrætsaktiviteter for børn og unge, hoppeborg, kiosk med
  lækkerier samt en herlig grillbuffet fra kl. 17:30.


  Tag naboen under armen og vær med til at fejre fællesskabet!'
