  i Hashøj.
project_goals: Etablere 1 godkendt udendørs padelbane med belysning og integreret
  bookingsystem.
deliverables: Færdigetableret bane, online nøglefrit adgangssystem og åbningsturnering.
in_scope: Baneunderlag, glasvægge, lysmaster, hegn og integration til foreningens
  hjemmeside.
out_of_scope: Indendørs overdækning (udskydes til eventuel fase 2).
