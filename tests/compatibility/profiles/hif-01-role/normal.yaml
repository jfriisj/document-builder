owner_committee: "Fodboldudvalget"
version_label: "1.0"
updated_at: "2026-09-01"
approved_by: "Fodboldudvalget / Bestyrelsen"
role_name: "Ungdomsformand Fodbold"
role_area: "Fodbold"
role_purpose: "Overordnet ledelse og koordinering af børne- og ungdomsfodbold i Hashøj IF, herunder sikring af gode rammer for trænere, spillere og forældre."
reports_to: "Fodboldformanden og Hovedbestyrelsen"
collaboration_partners: "Ungdomstrænere, forældreråd, kassereren, baneformanden og Eksempel Idrætsforbund"
estimated_time: "ca. 3-5 timer ugentligt i sæsonen (marts-juni og august-oktober)"
election_period: "2 år (udpeges af Fodboldudvalget på årsmødet i ulige år)"

responsibilities:
  - task_name: "Sæsonplanlægning og holdtilmelding til DBU-turneringer"
    frequency: "Halvårligt"
    deadline: "1. marts & 1. august"
    relevant_task_card: "HIF-02 DBU Holdtilmelding"
  - task_name: "Afholdelse af trænermøder for ungdomstrænere"
    frequency: "Kvartalsvis"
    deadline: "Før sæsonopstart og midtvejs"
    relevant_task_card: "HIF-02 Trænermøder"
  - task_name: "Rekruttering og fastholdelse af frivillige trænere og holdledere"
    frequency: "Løbende"
    deadline: "Løbende før sæsonstart"
    relevant_task_card: "HIF-01 Trænerrolle"

can_decide_independently: "Må godkende holdtilmeldinger, fastsætte træningstider i samråd med halinspektør og godkende mindre materialekøb inden for udvalgets ramme."
requires_approval_from: "Nyetablering af hold med særlige omkostninger eller dispositioner ud over det godkendte årsbudget skal godkendes af Fodboldudvalget."
financial_mandate: "Op til 2.500 kr. pr. disposition til materialer og trænerkurser."
contract_signing_authority: "Nej, formelle kontrakter og trænergodtgørelser underskrives af kasserer/hovedformand."

access_resources:
  - resource_name: "DBU KlubOffice (Klubhverv Ungdom)"
    purpose: "Holdtilmelding, spillerregistrering og turneringsplanlægning"
    access_procedure: "Tildeles af foreningens DBU-administrator"
    cessation_responsibility: "Adgang lukkes straks ved fratrædelse"
  - resource_name: "Nøglebrik til klubhus og boldrum"
    purpose: "Adgang til faciliteter og materialer"
    access_procedure: "Udleveres mod kvittering af halinspektør"
    cessation_responsibility: "Afleveres til halinspektør"

annual_cycle:
  - period: "Januar - Februar"
    activity: "Afklaring af trænersituation for forårssæsonen og indendørsstævner"
    preparation: "Udsendelse af spørgeskema til trænere"
    recipient_partner: "Ungdomstrænere"
  - period: "Marts"
    activity: "Sæsonopstartsmøde for alle børne- og ungdomshold"
    preparation: "Booking af klublokale og dagsorden"
    recipient_partner: "Trænere og forældrerepræsentanter"
  - period: "Juni"
    activity: "Sæsonafslutning og sommercup-koordinering"
    preparation: "Medaljebestilling og diplomudskrivning"
    recipient_partner: "Fodboldudvalget"

required_competencies: "Gode samarbejdsevner, erfaring med foreningsarbejde og lyst til at engagere frivillige."
preferred_competencies: "Kendskab til DBU KlubOffice og pædagogisk indsigt i børne- og ungdomsidræt."
onboarding_description: "Grundig overlevering fra afgående ungdomsformand samt introduktionsmøde med fodboldformand og kasserer."
key_documents: "Hashøj IFs vedtægter, Børneattestpolitik, DBU Børnefodboldmanual og HIF-01 Rollebeskrivelser."
handover_items: "Adgangskoder, kontaktliste over trænere/forældre, oversigt over igangværende projekter og nøglebrikker."
documentation_location: "Hashøj IF Google Drev / Fodbold / Ungdomsafdelingen"
contact_for_questions: "Fodboldformand Testperson A (tlf. 00 00 00 01, formand@example.com)"
