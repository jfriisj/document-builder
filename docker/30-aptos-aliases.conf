<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Deterministic sans-serif font substitution for Microsoft Aptos typography -->
  <match target="pattern">
    <test name="family">
      <string>Aptos</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Carlito</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family">
      <string>Aptos Display</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Carlito</string>
    </edit>
  </match>
</fontconfig>
